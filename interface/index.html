<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>naoplanar</title>
<style>
  :root {
    --fundo: #f4f4f1; --painel: #ffffff; --texto: #1d1d1b; --suave: #6b6b66; --linha: #deded8;
    --acento: #2f6f4f; --acento-claro: #e3efe8; --perigo: #b3261e; --perigo-claro: #fbe9e7; --aviso: #8a5a00; --aviso-claro: #fdf3dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #161615; --painel: #1f1f1d; --texto: #ececea; --suave: #a3a39d; --linha: #34342f;
      --acento: #6fbf93; --acento-claro: #1f3329; --perigo: #ff8a80; --perigo-claro: #3a1f1d; --aviso: #f2c46d; --aviso-claro: #3a3020;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--fundo); color: var(--texto); }
  header { display: flex; align-items: baseline; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--linha); background: var(--painel); }
  header h1 { margin: 0; font-size: 17px; }
  header span { color: var(--suave); font-size: 13px; }
  header .idioma { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--suave); }
  header .idioma select { width: auto; }
  main { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 45px); }
  aside { overflow-y: auto; padding: 12px; border-right: 1px solid var(--linha); background: var(--painel); }
  section.bloco { border: 1px solid var(--linha); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  section.bloco h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); display: flex; justify-content: space-between; }
  .soltar { border: 1.5px dashed var(--linha); border-radius: 6px; padding: 10px; text-align: center; color: var(--suave); cursor: pointer; }
  .soltar.sobre { border-color: var(--acento); background: var(--acento-claro); }
  .info { font-size: 12.5px; color: var(--suave); margin-top: 6px; }
  .info b { color: var(--texto); font-weight: 600; }
  label.campo { display: grid; grid-template-columns: 1fr 92px; align-items: center; gap: 8px; margin: 5px 0; font-size: 13px; }
  input[type=number], input[type=text], select { width: 100%; padding: 4px 6px; border: 1px solid var(--linha); border-radius: 5px; background: var(--fundo); color: var(--texto); font: inherit; }
  table.ancoras { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.ancoras th { text-align: left; font-weight: 500; color: var(--suave); padding: 2px 3px; }
  table.ancoras td { padding: 2px 3px; }
  table.ancoras input, table.ancoras select { padding: 3px 4px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--linha); background: var(--fundo); color: var(--texto); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--acento); }
  button:disabled { opacity: .5; cursor: default; }
  button.principal { background: var(--acento); color: #fff; border-color: var(--acento); width: 100%; padding: 9px; font-weight: 600; }
  @media (prefers-color-scheme: dark) { button.principal { color: #10241a; } }
  button.mini { padding: 1px 7px; font-size: 12px; }
  .msg { overflow-wrap: anywhere; border-radius: 6px; padding: 7px 9px; margin-top: 8px; font-size: 13px; }
  .msg.ok { background: var(--acento-claro); }
  .msg.erro { background: var(--perigo-claro); color: var(--perigo); }
  .msg.aviso { background: var(--aviso-claro); color: var(--aviso); }
  .linha-botoes { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .vista { display: flex; flex-direction: column; min-width: 0; }
  .abas { display: flex; gap: 4px; padding: 8px 12px 0; align-items: center; }
  .abas button { border-radius: 6px 6px 0 0; border-bottom: none; }
  .abas button.ativa { background: var(--painel); font-weight: 600; }
  .abas .controle { margin-left: auto; font-size: 12.5px; color: var(--suave); display: flex; align-items: center; gap: 6px; }
  .tela { flex: 1; position: relative; background: var(--painel); border-top: 1px solid var(--linha); }
  .tela canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .legenda { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--suave); pointer-events: none; }
  details summary { cursor: pointer; font-size: 13px; color: var(--suave); }
  .relatorio dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; font-size: 13px; }
  .relatorio dt { color: var(--suave); }
  .relatorio dd { margin: 0; }
  .oculto { display: none !important; }
</style>
</head>
<body>
<header><h1>naoplanar</h1><span id="subtitulo"></span><label class="idioma"><span id="rotuloIdioma"></span> <select id="idioma"></select></label></header>
<main>
  <aside>
    <section class="bloco">
      <h2 data-t="peca.titulo"></h2>
      <div class="soltar" id="soltarPeca" data-t="peca.soltar"></div>
      <input type="file" id="arquivoPeca" accept=".stl" class="oculto">
      <div class="info" id="infoPeca"></div>
    </section>

    <section class="bloco">
      <h2 data-t="config.titulo"></h2>
      <div class="soltar" id="soltarConfig" data-t="config.soltar"></div>
      <input type="file" id="arquivoConfig" accept=".gcode,.3mf" class="oculto">
      <div class="info" id="infoConfig"></div>
      <div class="info" id="infoOrca"></div>
    </section>

    <section class="bloco">
      <h2><span data-t="camadas.titulo"></span><select id="predefinicao" style="width:auto;font-size:12px"></select></h2>
      <label class="campo"><span data-t="camadas.base"></span><input type="number" id="base" min="0" step="0.2" value="1"></label>
      <table class="ancoras">
        <thead><tr><th data-t="ancora.altura"></th><th data-t="ancora.forma"></th><th data-t="ancora.angulo"></th><th data-t="ancora.direcao"></th><th></th></tr></thead>
        <tbody id="ancoras"></tbody>
      </table>
      <div class="linha-botoes"><button class="mini" id="novaAncora" data-t="ancora.adicionar"></button></div>
      <div class="info" data-t="camadas.explica"></div>
      <div id="validacao"></div>
    </section>

    <section class="bloco">
      <details id="detalhesCabecote">
        <summary data-t="cabecote.titulo"></summary>
        <label class="campo"><span data-t="cabecote.folga"></span><input type="number" id="folga" step="0.1"></label>
        <label class="campo"><span data-t="cabecote.margem"></span><input type="number" id="margem" step="0.1" min="0"></label>
        <label class="campo"><span data-t="cabecote.raioCabeca"></span><input type="number" id="raioCabeca" step="1"></label>
        <label class="campo"><span data-t="cabecote.raioBico"></span><input type="number" id="raioBico" step="0.1"></label>
        <label class="campo"><span data-t="cabecote.zMax"></span><input type="number" id="zMax" step="1" min="0"></label>
        <div class="info" data-t="cabecote.duto"></div>
        <div class="soltar" id="soltarDuto" data-t="cabecote.soltarDuto" style="margin-top:6px"></div>
        <input type="file" id="arquivoDuto" accept=".stl" class="oculto">
        <div class="info" id="infoDuto"></div>
        <label class="campo"><span data-t="cabecote.bico"></span><input type="text" id="bico" placeholder="x, y, z"></label>
        <div class="linha-botoes"><button id="salvarPerfil" data-t="cabecote.salvar"></button><button id="removerDuto" class="mini" data-t="cabecote.removerDuto"></button></div>
        <div id="msgPerfil"></div>
      </details>
      <div class="info" id="resumoCabecote"></div>
    </section>

    <section class="bloco">
      <button class="principal" id="gerar" data-t="gerar.botao"></button>
      <div class="info" id="progresso"></div>
      <div id="resultado" class="relatorio"></div>
    </section>
  </aside>

  <div class="vista">
    <div class="abas">
      <button id="abaCorte" class="ativa" data-t="vista.corte"></button>
      <button id="aba3d" data-t="vista.tres"></button>
      <div class="controle" id="controleCorte"><span data-t="vista.direcaoCorte"></span><input type="range" id="direcaoCorte" min="0" max="180" step="5" value="0" style="width:120px"><span id="direcaoValor">0°</span></div>
      <div class="controle oculto" id="controle3d"><label><input type="checkbox" id="mostrarCaminho" checked> <span data-t="vista.caminho"></span></label><label><input type="checkbox" id="mostrarPeca" checked> <span data-t="vista.peca"></span></label></div>
    </div>
    <div class="tela" id="telaCorte"><canvas id="canvasCorte"></canvas><div class="legenda" id="legendaCorte"></div></div>
    <div class="tela oculto" id="tela3d"><canvas id="canvas3d"></canvas><div class="legenda" id="legenda3d"></div></div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
